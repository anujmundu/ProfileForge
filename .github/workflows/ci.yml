name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Project
        run: |
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .

      - name: Black
        run: |
          black --check .

      - name: MyPy
        run: |
          mypy src

      - name: Pytest
        run: |
          pytest
