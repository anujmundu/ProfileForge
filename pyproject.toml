[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-profile-engine"
version = "1.0.0"
description = "A production-grade GitHub profile dashboard engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Anuj Mundu" }
]

dependencies = [
    "pydantic>=2.11.0",
    "requests>=2.32.0",
    "python-dotenv>=1.1.0",
    "Jinja2>=3.1.6",
    "PyGithub>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "black>=25.0.0",
    "ruff>=0.12.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]