[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

################################################################################
# Project Metadata
################################################################################

[project]
name = "github-profile-engine"
version = "1.0.0"
description = "A production-grade GitHub profile dashboard engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Anuj Mundu" }
]

keywords = [
    "github",
    "dashboard",
    "svg",
    "profile",
    "github-api",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "Jinja2>=3.1.6",
    "PyGithub>=2.7.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "PyYAML>=6.0",
    "requests>=2.32.0",
]

################################################################################
# Command Line Entry Point
################################################################################

[project.scripts]
github-profile-engine = "github_profile_engine.main:main"

################################################################################
# Optional Dependencies
################################################################################

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "coverage[toml]>=7.10.0",
    "mypy>=1.18.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",

    "types-PyYAML",
]

################################################################################
# Setuptools
################################################################################

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

################################################################################
# Black
################################################################################

[tool.black]
line-length = 88
target-version = ["py312"]

################################################################################
# Ruff
################################################################################

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = []

################################################################################
# MyPy
################################################################################

[tool.mypy]
python_version = "3.12"

mypy_path = "src"
explicit_package_bases = true

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

check_untyped_defs = true
no_implicit_optional = true

pretty = true
show_error_codes = true

exclude = [
    "^\\.venv/",
]

################################################################################
# Pytest
################################################################################

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

addopts = [
    "-ra",
    "--strict-markers",
]

################################################################################
# Coverage
################################################################################

[tool.coverage.run]
branch = true

source = [
    "src",
]

omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

fail_under = 80
