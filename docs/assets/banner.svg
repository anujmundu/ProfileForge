<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1E38" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle Mesh Grid Pattern -->
  <path d="M 0 80 L 1200 80 M 0 160 L 1200 160 M 0 240 L 1200 240" stroke="#1E293B" stroke-width="1" opacity="0.4" />
  <path d="M 300 0 L 300 320 M 600 0 L 600 320 M 900 0 L 900 320" stroke="#1E293B" stroke-width="1" opacity="0.4" />

  <!-- Logo Mark in Banner -->
  <g transform="translate(100, 85)">
    <rect width="150" height="150" rx="30" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <path d="M 37.5 45 L 75 27 L 112.5 45 L 112.5 105 L 75 123 L 37.5 105 Z" fill="none" stroke="url(#textGrad)" stroke-width="6" stroke-linejoin="round" />
    <circle cx="75" cy="75" r="16" fill="#F43F5E" />
    <path d="M 70 67 L 82 75 L 70 83" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text Heading & Subtitle -->
  <text x="290" y="140" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">ProfileForge</text>
  <text x="290" y="190" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">Production-Grade Self-Updating GitHub Profile README &amp; Animated SVG Engine</text>

  <!-- Badges Pill -->
  <g transform="translate(290, 220)">
    <rect width="140" height="32" rx="16" fill="#1E293B" />
    <text x="70" y="21" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">v1.0.0 Stable</text>
  </g>
  <g transform="translate(440, 220)">
    <rect width="140" height="32" rx="16" fill="#1E293B" />
    <text x="70" y="21" fill="#4ADE80" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">94% Coverage</text>
  </g>
  <g transform="translate(590, 220)">
    <rect width="150" height="32" rx="16" fill="#1E293B" />
    <text x="75" y="21" fill="#A855F7" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">MyPy Strict Mode</text>
  </g>
</svg>
